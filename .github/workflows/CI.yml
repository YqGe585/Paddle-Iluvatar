name: CI

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop, release/**]

permissions: read-all

concurrency:
  group: ${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  PR_ID: ${{ github.event.pull_request.number }}
  COMMIT_ID: ${{ github.event.pull_request.head.sha }}
  BRANCH: develop

jobs:
  Clone:
    name: Clone
    if: ${{ github.repository_owner == 'PaddlePaddle' }}
    runs-on:
      group: HK-Clone

    steps:
      - name: Clone Paddle-iluvatar
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Merge PR to test branch
        run: |
          set -x
          git config user.name "PaddleCI"
          git config user.email "paddle_ci@example.com"
          git fetch origin pull/${{ github.event.pull_request.number }}/head
          git checkout -b test FETCH_HEAD
          git merge --no-edit ${BRANCH}
          git submodule sync
          git submodule update --init --recursive --force
          cd Paddle/third_party/protobuf
          git fetch --tags
          cd ../pybind
          git fetch --tags
          cd ../gloo
          git fetch --tags
          cd ../../..

      - name: Download bos client
        env:
          home_path: "/home/paddle/actions-runner/"
          bos_file: "/home/paddle/actions-runner/bos/BosClient.py"
        run: |
          if [ ! -f "${bos_file}" ]; then
            wget -q --no-proxy -O ${home_path}/bos_new.tar.gz https://xly-devops.bj.bcebos.com/home/bos_new.tar.gz --no-check-certificate
            mkdir ${home_path}/bos
            tar xf ${home_path}/bos_new.tar.gz -C ${home_path}/bos
          fi

      - name: Push to BOS
        env:
          AK: paddle
          SK: paddle
          bos_file: "/home/paddle/actions-runner/bos/BosClient.py"
        run: |
          set -x
          cd ..
          tar -I 'zstd -T0' -cf Paddle-iluvatar.tar.gz Paddle-iluvatar
          echo "::group::Install bce-python-sdk"
          python -m pip install bce-python-sdk==0.8.74
          echo "::endgroup::"
          python ${bos_file} Paddle-iluvatar.tar.gz paddle-github-action/Paddle-iluvatar/PR/${PR_ID}/${COMMIT_ID}
          rm Paddle-iluvatar.tar.gz
          cd -
          git switch ${BRANCH}
          set +e
          git branch -D test
          git gc

  Codestyle-Check:
    name: Codestyle-Check
    needs: Clone
    if: ${{ github.repository_owner == 'PaddlePaddle' }}
    runs-on:
      group: APPROVAL
    env:
      TASK: paddle-CI-${{ github.event.pull_request.number }}-cpu

    steps:
      - name: Cleanup
        run: |
          rm -rf * .[^.]*

      - name: Check docker image and run container
        env:
          python: "python3.10"
          GIT_PR_ID: ${{ github.event.pull_request.number || '0' }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          docker_image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/ci/paddle:19d3669ca5ff0b19144a785bb3126d7e
        run: |
          container_name=${TASK}-$(date +%Y%m%d-%H%M%S)
          echo "container_name=${container_name}" >> $GITHUB_ENV
          docker run -d -t --name ${container_name} --shm-size=128g \
            -v ${{ github.workspace }}/../../..:${{ github.workspace }}/../../.. \
            -v ${{ github.workspace }}:/paddle \
            -e python \
            -e BRANCH \
            -e PR_ID \
            -e COMMIT_ID \
            -e RUN_ID \
            -e GIT_PR_ID \
            -e GITHUB_API_TOKEN \
            -w /paddle --network host ${docker_image} /bin/bash

      - name: Download Code
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          wget -q --tries=5 --no-proxy https://paddle-github-action.bj.bcebos.com/Paddle-iluvatar/PR/${PR_ID}/${COMMIT_ID}/Paddle-iluvatar.tar.gz --no-check-certificate
          echo "Extracting Paddle-iluvatar.tar.gz"
          tar -xf Paddle-iluvatar.tar.gz --strip-components=1
          git config --global --add safe.directory "*"
          git remote add upstream https://github.com/${{ github.repository }}.git
          git merge ${BRANCH} --no-edit
          pip install cpplint==1.6.0
          pre-commit install'

      - name: Run Codestyle Check
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          bash tools/codestyle/pre_commit.sh'

      - name: Terminate and delete the container
        if: always()
        run: |
          docker exec -t ${{ env.container_name }} /bin/bash -c '
          rm -rf * .[^.]*
          ' || true
          docker stop ${{ env.container_name }} || true
          docker rm ${{ env.container_name }} || true

  PR-CI-IXUCA:
    name: PR-CI-IXUCA
    needs: Codestyle-Check
    if: ${{ github.repository_owner == 'PaddlePaddle' }}
    runs-on: iluvatar-gpu-2
    container:
      image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/device/paddle-ixuca:3.3.0
      env:
        LD_LIBRARY_PATH: /usr/local/corex/lib
        LIBRARY_PATH: /usr/local/corex/lib
    env:
      PR_ID: ${{ github.event.pull_request.number }}
      COMMIT_ID: ${{ github.event.pull_request.head.sha }}
      BRANCH: develop
      no_proxy: "bcebos.com,apiin.im.baidu.com,gitee.com,aliyun.com,.baidu.com,.tuna.tsinghua.edu.cn"

    steps:
      - name: Download Code
        run: |
          set -x
          wget -q --tries=5 --no-proxy https://paddle-github-action.bj.bcebos.com/Paddle-iluvatar/PR/${PR_ID}/${COMMIT_ID}/Paddle-iluvatar.tar.gz --no-check-certificate
          echo "Extracting Paddle-iluvatar.tar.gz"
          tar -xf Paddle-iluvatar.tar.gz
          cd Paddle-iluvatar
          git config --global --add safe.directory "*"
          git merge ${BRANCH} --no-edit
          git --no-pager log --pretty=oneline -5

      - name: Build paddlepaddle-iluvatar
        run: |
          export PATH=/usr/local/corex/bin:$PATH
          cd Paddle-iluvatar
          apt-get install -y patchelf
          # export https_proxy=http://oversea-website-proxy.aistudio.public:8888
          # export http_proxy=http://oversea-website-proxy.aistudio.public:8888
          bash build_paddle.sh

      - name: Install paddlepaddle-iluvatar
        run: |
          pip install Paddle-iluvatar/Paddle/build/python/dist/paddlepaddle_iluvatar*.whl
          python3 -m pip install parameterized

      - name: Run Tests
        run: |
          export FLAG_SKIP_FLOAT64=1
          cd Paddle-iluvatar/tests
          bash run_test.sh

      - name: Cleanup
        if: always()
        run: |
          rm -rf * .[^.]*
          chmod -R 777 . || true
